[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infomentor-api"
version = "0.1.0"
description = "Unofficial Python client for the InfoMentor Hub school API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "infomentor-api contributors" }]
keywords = ["infomentor", "school", "hub", "api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
infomentor = "infomentor.cli:main"

[project.urls]
Homepage = "https://github.com/CageHN/infomentor-api"
Issues = "https://github.com/CageHN/infomentor-api/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
infomentor = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
